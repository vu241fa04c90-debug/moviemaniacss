<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Profile - MovieManiacs</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <!-- HEADER -->

    <header>

        <h1>MovieManiacs</h1>

        <nav>

            <a href="index.html">Home</a>

            <a href="index.html#movies">Movies</a>

            <a href="reviews.html">Reviews</a>

            <a href="diary.html">Diary</a>

            <a href="profile.html">Profile</a>

        </nav>

    </header>


    <!-- PROFILE -->

    <main>

        <section class="profile-page">


            <!-- LOGGED IN -->

            <div
                class="profile-card"
                id="profileCard"
            >

                <h2>My Profile</h2>


                <div class="profile-info">

                    <label>
                        Name
                    </label>

                    <p id="userName">
                        Loading...
                    </p>

                </div>


                <div class="profile-info">

                    <label>
                        Email
                    </label>

                    <p id="userEmail">
                        Loading...
                    </p>

                </div>


                <div class="profile-info">

                    <label>
                        Account Status
                    </label>

                    <p class="status">
                        ✓ Logged in
                    </p>

                </div>


                <button
                    class="logout-btn"
                    onclick="logout()"
                >
                    Logout
                </button>


                <a
                    href="index.html"
                    class="back-home"
                >
                    ← Back to Home
                </a>

            </div>


            <!-- NOT LOGGED IN -->

            <div
                class="profile-card not-logged"
                id="notLoggedIn"
                style="display: none;"
            >

                <h2>My Profile</h2>

                <p>
                    You are not logged in.
                </p>

                <a href="login.html">
                    Login here
                </a>

            </div>


        </section>

    </main>


    <!-- FOOTER -->

    <footer>

        <p>
            &copy; 2026 MovieManiacs. Built by Pranay.
        </p>

        <p>
            Made with HTML & CSS.
        </p>

    </footer>


    <script>

        const user =
            JSON.parse(
                localStorage.getItem(
                    "loggedInUser"
                )
            );


        if (!user) {

            document
                .getElementById("profileCard")
                .style.display = "none";


            document
                .getElementById("notLoggedIn")
                .style.display = "block";

        }

        else {

            document
                .getElementById("userName")
                .textContent =
                user.name ||
                "Name not available";


            document
                .getElementById("userEmail")
                .textContent =
                user.email ||
                "Email not available";

        }


        function logout() {

            localStorage.removeItem(
                "loggedInUser"
            );


            window.location.href =
                "login.html";

        }

    </script>

</body>

</html>
